<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun</title>
    <link rel="stylesheet" href="sytle.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <button class="reset-btn" id="reset-btn" title="Baştan Başlat">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
                Baştan Başlat
            </button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Dinamik mesajlar buraya gelecek -->
        </div>
        <div class="typing-indicator" id="typing-indicator" style="display: none;">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="chat-bottom-bar" id="chat-bottom-bar">
            <div class="action-buttons-wrapper" id="action-buttons-wrapper">
                <!-- Butonlar burada sağ hizalı olarak görünecek -->
            </div>
            <button class="pause-resume-btn" id="pause-resume-btn" title="Duraklat / Devam Et">
                <svg id="pause-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
                <svg id="play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display: none;">
                    <polygon points="5,3 19,12 5,21"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- Tam Ekran Medya Görüntüleyici Modal -->
    <div id="media-modal" class="media-modal" style="display: none;">
        <span class="media-modal-close">&times;</span>
        <div class="media-modal-content-container" id="media-modal-content-container">
            <!-- Dinamik içerik buraya gelecek -->
        </div>
    </div>
</body>
</html>
